[package]
name = "taskvault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.1"

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
near-api = "=0.8.7"
near-sandbox = "=0.3.16"
tokio = { version = "1.48.0", features = ["full"] }
serde_json = "1"
testresult = "0.4.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
